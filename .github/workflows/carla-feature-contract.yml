name: CARLA feature validity gate

on:
  pull_request:
    paths:
      - "carla_demo/04_spawn_scene.py"
      - "carla_demo/05_feature_engine.py"
      - "scripts/audit_demo_trajectory_lineage.py"
      - "scripts/audit_tgsim_source_data.py"
      - "scripts/cluster_statistics.py"
      - "scripts/benchmark_artifacts.py"
      - "scripts/run_highway_benchmark.py"
      - "scripts/generate_supplementary_figures.py"
      - "FIGURE_DATA_PROVENANCE_AUDIT.md"
      - "scripts/trajectory_windowing.py"
      - "scripts/run_highway_benchmark.py"
      - "scripts/run_highway_ablation.py"
      - "tests/**"
      - "CLUSTERED_STATISTICAL_PROTOCOL.md"
      - "TRAJPILOT_RESEARCH_REPORT.md"
      - "PAPER_READINESS_AUDIT.md"
      - "scripts/train_tgsim_physical_model.py"
      - "scripts/run_tgsim_cross_dataset.py"
      - "curla demostrate/*.csv"
      - "carla_demo/07_visualization.py"
      - "carla_demo/08_run_demo.py"
      - ".github/workflows/carla-feature-contract.yml"
  push:
    branches:
      - "audit/carla-feature-validity-gate"
      - "fix/carla-inference-history-warmup"
      - "audit/demo-trajectory-lineage"
      - "data/tgsim-source-auditor"
      - "fix/exact-cadence-windowing"
      - "fix/clustered-bootstrap"
      - "fix/empirical-figure-provenance"
      - "fix/benchmark-prediction-lineage"

jobs:
  feature-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Compile changed training and evaluation scripts
        run: |
          python -m py_compile scripts/trajectory_windowing.py scripts/cluster_statistics.py scripts/benchmark_artifacts.py scripts/generate_supplementary_figures.py scripts/run_highway_benchmark.py scripts/run_highway_ablation.py scripts/train_tgsim_physical_model.py scripts/run_tgsim_cross_dataset.py
      - name: Run repository demo-data audit
        run: python scripts/audit_demo_trajectory_lineage.py
      - name: Run project contract and lineage tests
        run: python -m unittest discover -s tests -v
